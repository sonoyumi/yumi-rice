# yumi-sddm: создано install.sh — указатель на экране входа SDDM (Xorg) как в Hyprland
# В Hyprland: accel_profile = flat (без ускорения), тачпад — натуральная прокрутка, без tap-to-click,
# клик пальцами, отключение во время набора. Xorg по умолчанию ускоряет курсор → «слишком чувствительно».
# Медленнее/быстрее: AccelSpeed от -1.0 до 1.0 (0 — как есть). Откат: sudo …/sddm/uninstall.sh
Section "InputClass"
	Identifier "yumi: мышь без ускорения"
	MatchIsPointer "on"
	MatchDriver "libinput"
	Option "AccelProfile" "flat"
	Option "AccelSpeed" "0"
EndSection

Section "InputClass"
	Identifier "yumi: тачпад как в Hyprland"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "AccelProfile" "flat"
	Option "AccelSpeed" "0"
	Option "NaturalScrolling" "true"
	Option "Tapping" "false"
	Option "ClickMethod" "clickfinger"
	Option "DisableWhileTyping" "true"
EndSection
