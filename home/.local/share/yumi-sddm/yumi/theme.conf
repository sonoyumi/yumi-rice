# Настройки темы yumi по умолчанию.
# Цвета, обои и аватар перекрываются файлом theme.conf.user
# (симлинк на /var/lib/yumi-sddm/theme.conf.user, его пишет yumi-sddm-sync).
[General]
# фон: резкий и размытый (используется размытый, как в hyprlock)
Background="background.jpg"
BackgroundBlur="background.jpg"
# затемнение фона 0..1
Dim=0.18
# аватар (пусто — иконка пользователя от SDDM, иначе первая буква имени)
Avatar=
# цвета: #AARRGGBB или #RRGGBB
AccentColor="#f2e6e6e6"
CardColor="#6b1c1c1c"
DeepColor="#f21c1c1c"
TextColor="#ffffff"
MutedColor="#b8b8b8"
ErrorColor="#ff8a80"
# сеанс по умолчанию (файл .desktop из /usr/share/wayland-sessions)
DefaultSession=hyprland-uwsm.desktop
# пользователь по умолчанию (sync подставляет ваше имя)
DefaultUser=
# язык надписей и формат даты
Locale=ru_RU
# шрифт значков (системный, виден пользователю sddm)
IconFont="JetBrainsMono Nerd Font Propo"
