# Мониторы оболочки yumi — один файл вместо констант в скриптах.
# Читают: меню Quickshell и yumi-panel, yumi-player, rofi и rofi-panel, yumi-hyprlock-build, меню «Рабочие столы».
# Монитора нет в списке → коэффициент 1.0, DPI rofi 96, название = имя выхода (`hyprctl monitors`).
# Пустой файл — нормально: всё работает с этими значениями.
#
# выход   интерфейс  dpi_rofi  название   ширина высота масштаб
#                                         (логические px и масштаб — только для сборки экрана
#                                          блокировки, когда монитор сейчас не подключён)
# Пример (раскомментируйте и поправьте под себя):
# eDP-1     0.85       96        Ноутбук    1600   1000   1.6
# DP-1      0.8        64        Монитор    1920   1080   1.0
