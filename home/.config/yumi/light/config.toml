# yumi-light — автояркость клавиш MacBook. После правки: systemctl --user restart yumi-light
dark_below = 80      # люксы: темнее этого — клавиши загораются
bright_above = 200   # люксы: светлее этого — клавиши гаснут (между порогами ничего не меняется)
level = 60           # % яркости в темноте при самом первом запуске; дальше запоминается твой ползунок
smooth = 4           # секунд сглаживания датчика (больше — спокойнее реагирует на тень от руки)
fade = 0.8           # секунд на плавный переход
