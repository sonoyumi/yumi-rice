# yumi-greeter (19.10.2026): sway только для экрана входа greetd — вместо cage (тот растягивал одно окно на оба
# монитора, без масштаба и с белыми рамками Qt). Мониторы sway расставит сам; свои режим, место и масштаб —
# строками «output <имя> mode … position … scale …» (имена: swaymsg -t get_outputs).
# Копию кладёт yumi-greeter-sync в /var/lib/yumi-greeter/home/.config/yumi/greeter/; запускает yumi-greeter.
output * bg #000000 solid_color

default_border none
default_floating_border none
focus_follows_mouse no
seat seat0 xcursor_theme Adwaita 20

# пароль — латиницей; переключение раскладок в Hyprland делает его бинд, здесь его нет
input type:keyboard xkb_layout us
input type:touchpad {
    tap disabled
    natural_scroll enabled
}

# экран входа (greeter.qml, WlSessionLock на каждом мониторе); вышел — выйти и из sway, greetd запустит сеанс
exec sh -c 'qs -p "$YUMI_GREETER_QML"; swaymsg exit'
