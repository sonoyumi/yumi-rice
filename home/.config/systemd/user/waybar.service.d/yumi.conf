# yumi: Waybar из пакета, но со своим лейаутом напрямую (без генерации config.jsonc через HyDE)
# и перезапуском при любом выходе (как было у HyDE). Откат: yumi-uninstall hyde-exit
[Service]
ExecStart=
ExecStart=/usr/bin/waybar -c %h/.config/waybar/layouts/yumi.jsonc -s %h/.config/waybar/style.css
Restart=always
RestartSec=1
Slice=app-graphical.slice
# Процессы, запущенные кликом по бару (меню, проверка обновлений flatpak…), живут в группе Waybar и могут
# не выходить по SIGTERM — тогда перезапуск при смене обоев ждал 10 с без бара. Ждём не дольше 1 с.
TimeoutStopSec=1s
