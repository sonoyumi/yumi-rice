# 16.10: плавная загрузка — без кэша (иначе демон сам на миг показывает старые обои), при загрузке на встроенном
# экране кадр загрузки, обои — после экрана блокировки (см. yumi-awww-post). Откат: удалить этот файл.
[Service]
ExecStart=
ExecStart=/usr/bin/awww-daemon --format xrgb --no-cache
ExecStartPost=
ExecStartPost=%h/.local/bin/yumi-awww-post
TimeoutStartSec=40
