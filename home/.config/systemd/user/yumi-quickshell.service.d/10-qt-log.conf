# yumi: Qt 6.12 пишет WARN qt.qpa.wayland.textinput при каждой потере фокуса клавиатуры окном меню
# (Esc / щелчок вне окна через HyprlandFocusGrab) — это не ошибка QML, глушим категорию.
# Для своего экземпляра: QT_LOGGING_RULES='qt.qpa.wayland.textinput.warning=false' qs -p dev-….qml
# Откат: yumi-uninstall quickshell
[Service]
Environment=QT_LOGGING_RULES=qt.qpa.wayland.textinput.warning=false
