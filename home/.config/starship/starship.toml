# Yumi-Rice: приглашение «Дзен» (19.10.2026) — одна строка, справа git и время;
# старые приглашения после Enter сворачиваются до ❯ (conf.d/yumi/style.zsh).
# Цвета — именами палитры терминала (yellow, bright-black…): kitty перекрашивает палитру вместе с обоями.
# Красный ошибок #c8372d — как печать 〔弓〕 в fastfetch, от обоев не зависит.
# Прежний вид (2 строки, вариант C): starship.toml.bak-zsh-20261019
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = "[弓](bold yellow) $directory$character"
right_format = "$git_branch$git_status$python$cmd_duration$status$time"

[character]
success_symbol = "[❯](bold yellow)"
error_symbol = "[❯](bold #c8372d)"

[directory]
style = "yellow"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "green"
format = "[$symbol$branch]($style) "

[git_status]
style = "#c8372d"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "blue"
format = "[$symbol$virtualenv]($style) "
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[$duration]($style) "

[status]
disabled = false
symbol = "✗ "
style = "#c8372d"
format = "[$symbol$status]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = "[· $time]($style)"
