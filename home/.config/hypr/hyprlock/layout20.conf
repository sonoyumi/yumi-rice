# Layout 20 (mahaveergurjar/Hyprlock-Dots) — версия под HyDE с цветами wallbash

source = @HOME@/.config/hypr/themes/colors.conf

$accent   = $wallbash_1xa7_rgba
$on_acc   = $wallbash_pry1_rgba
$text     = $wallbash_txt1_rgba
$text_dim = $wallbash_txt2_rgba
$card     = rgba(0, 0, 0, 0.3)

general {
    immediate_render = true
}

# Появление — плавно за 0.25 с (скорость в десятых долях секунды); при разблокировке исчезает
# сразу: любое затухание показывает серый экран (снимок при immediate_render пустой)
animations {
    enabled = true
    animation = fadeIn, 1, 2.5, default
    animation = fadeOut, 0
}

background {
    monitor =
    path = @HOME@/.cache/hyde/hyprlock-bg.png
    zindex = 0
    blur_passes = 0
}

# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = $card
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] cat /etc/hostname
    color = $text_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Log in
    color = $text
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

# Username
shape {
    monitor =
    size = 320, 70
    color = $accent
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = username
    color = $on_acc
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = <b>$USER</b>
    color = $on_acc
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -290, 115
    halign = center
    valign = center
    zindex = 3
}

# Password
label {
    monitor =
    text = password
    color = $on_acc
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $accent
    font_color = $on_acc
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 20
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

# --- RIGHT COLUMN ---

# PROFILE CARD
shape {
    monitor =
    size = 360, 380
    color = $card
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = @HOME@/.config/hypr/hyprlock/avatar.jpg
    size = 120
    rounding = 20
    border_size = 4
    border_color = $accent
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = $text
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%d %B, %Y"
    color = $text_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, 100
    halign = center
    valign = center
    zindex = 2
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = $card
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = $text
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = $text_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 110, -195
    halign = center
    valign = center
    zindex = 2
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU,UA]
    color = $text_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 310, -195
    halign = center
    valign = center
    zindex = 2
}
