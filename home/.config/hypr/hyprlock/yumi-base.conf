# yumi-base.conf — основа экрана блокировки (было ~/.local/share/hypr/hyprlock.conf HyDE).
# Оставлено только то, что реально действовало при макете yumi-google:
#  · цвета wallbash и сплошной фон в цвет обоев — виден, пока не загрузилась картинка фона макета;
#  · подключение макета $LAYOUT_PATH (задаётся в ~/.config/hypr/hyprlock.conf).
# Убрано (не действовало или не нужно): переменные $BACKGROUND_PATH/$MPRIS_*/$BATTERY_*/… (макет их не использует),
# general{} с $HYPRLOCK_* (переменные не заданы — значения отбрасывались; макет задаёт general{} сам),
# невидимая метка `font.sh resolve` (в макете нет $resolve.font), отпечаток пальца (выключен; на M1 не работает).
# Это не макет: в списке раскладок выбирать не нужно.

source = @HOME@/.config/hypr/themes/colors.conf

background {
    color = $wallbash_pry1_rgba
}

# hyprlang noerror true
source = $LAYOUT_PATH
# hyprlang noerror false
