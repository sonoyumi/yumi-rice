# После пробуждения: включить экран и сразу заново отрисовать обои,
# пока ещё открыт экран блокировки (чтобы после ввода пароля всё было готово)
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; awww img --transition-type none "$(readlink -f $HOME/.cache/yumi/theme/wall.set)"
}

# Перед блокировкой — английская раскладка на ВСЕХ клавиатурах (у каждой своя, у Logitech их две),
# иначе пароль уходит русскими/украинскими буквами, а 3 неверные попытки = faillock на 10 минут.
# Сюда приходят все блокировки: простой, сон, SUPER+N (yumi-lock → loginctl lock-session).
# Файл подключается последним, поэтому эта lock_cmd заменяет $LOCK_CMD из hypridle.conf HyDE
general {
    lock_cmd = yumi-lock --now   # раскладка EN на всех клавиатурах + hyprlock (второй не запускает)
}
