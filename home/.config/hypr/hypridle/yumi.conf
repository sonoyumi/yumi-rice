# После пробуждения: включить экран и сразу заново отрисовать обои,
# пока ещё открыт экран блокировки (чтобы после ввода пароля всё было готово)
# и сразу запустить Touch ID на экране блокировки (19.10: счётчик отказов до сна прятал подсказку)
general {
    # 02.11: после s2idle seat пересоздаётся и Hyprland не шлёт enter уже нарисованной поверхности
    # блокировки — пароль не печатается (Touch ID работает). yumi-lock-refocus пересчитывает фокус.
    # порядок: экран → обои → сразу Touch ID (wake), затем фокус клавиатуры.
    # yumi-lock-refocus сам ждёт возврата клавиатуры (~2 с) и не задерживает wake.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; awww img --transition-type none "$(readlink -f $HOME/.cache/yumi/theme/wall.set)"; qs -c yumi ipc call lockscreen wake; @HOME@/.local/bin/yumi-lock-refocus
}

# Перед блокировкой — английская раскладка на ВСЕХ клавиатурах (у каждой своя, у Logitech их две),
# иначе пароль уходит русскими/украинскими буквами, а 3 неверные попытки = faillock на 10 минут.
# Сюда приходят все блокировки: простой, сон, SUPER+N (yumi-lock → loginctl lock-session).
# Файл подключается последним, поэтому эта lock_cmd заменяет $LOCK_CMD из hypridle.conf HyDE
general {
    lock_cmd = yumi-lock --now   # раскладка EN на всех клавиатурах + hyprlock (второй не запускает)
}
