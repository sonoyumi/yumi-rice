# После пробуждения: включить экран и сразу заново отрисовать обои,
# пока ещё открыт экран блокировки (чтобы после ввода пароля всё было готово)
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; awww img --transition-type none "$(readlink -f $HOME/.cache/hyde/wall.set)"
}
