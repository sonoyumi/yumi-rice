# hyprlock — ЗАПАСНОЙ экран блокировки yumi-rice. Основной — Quickshell (lock/LockReal.qml), этот срабатывает,
# только если Quickshell не может показать экран (см. yumi-lock). Не запускать для проверки: каждый запуск и
# закрытие faillock считает неверным паролем.
# Вид — hyprlock/yumi-google.conf (собирает yumi-hyprlock-build из yumi-google.base.tmpl, правь шаблон),
# основа (цвета, шрифты, поле пароля, подключение $LAYOUT_PATH) — hyprlock/yumi-base.conf.
# Прежний файл (шаблон HyDE с комментариями) — hyprlock.conf.bak-brand-20261019.

$LAYOUT_PATH=@HOME@/.config/hypr/hyprlock/yumi-google.conf
source = @HOME@/.config/hypr/hyprlock/yumi-base.conf
